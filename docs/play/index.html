<style>/* EduPlay Universe — สไตล์หลัก (สีผ่านเกณฑ์ความต่างสี WCAG AA ทั้งโหมดสว่างและมืด) */
:root {
  --bg: #f6f4ff; --card: #ffffff; --ink: #1f1b3a; --mute: #5f5b80; --line: #e4dff5; --soft: #efeaff;
  --brand: #5b3df5; --brand-ink: #ffffff; --brand-soft: #ece7ff; --link: #4a2de0; --accent: #ff6fae;
  --ok: #15803d; --ok-soft: #dcfce7; --bad: #c62f45; --bad-soft: #fde4e8; --warn: #9a6700; --warn-soft: #fff4d6;
  --shadow: 0 8px 24px rgba(60, 30, 160, .08); --radius: 16px;
  --opt-red: #c62f45; --opt-blue: #1d5fd6; --opt-yellow: #8a5a00; --opt-green: #15803d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13111f; --card: #1d1a2e; --ink: #f2efff; --mute: #b3aed3; --line: #322d4d; --soft: #27223f;
    --brand: #5b3df5; --brand-ink: #ffffff; --brand-soft: #2c2552; --link: #c4b5ff; --accent: #ff8cc0;
    --ok: #4ade80; --ok-soft: #0f2e1d; --bad: #ff8a9b; --bad-soft: #3a1720; --warn: #ffd166; --warn-soft: #3a2e0c;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13111f; --card: #1d1a2e; --ink: #f2efff; --mute: #b3aed3; --line: #322d4d; --soft: #27223f;
  --brand: #5b3df5; --brand-ink: #ffffff; --brand-soft: #2c2552; --link: #c4b5ff; --accent: #ff8cc0;
  --ok: #4ade80; --ok-soft: #0f2e1d; --bad: #ff8a9b; --bad-soft: #3a1720; --warn: #ffd166; --warn-soft: #3a2e0c;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html { font-size: 100%; }
body { margin: 0; font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; font-size: 1rem; }
a { color: var(--link); }
h1 { font-size: clamp(1.5rem, 3.5vw, 2rem); margin: .2em 0 .4em; line-height: 1.3; }
h2 { font-size: 1.25rem; margin: 1.4em 0 .6em; }
h3 { font-size: 1.05rem; margin: .2em 0; }
img { max-width: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
main.wrap { padding-top: 24px; padding-bottom: 40px; min-height: 60vh; outline: none; }
.skip { position: absolute; left: -999px; top: 0; background: var(--brand); color: #fff; padding: 8px 12px; z-index: 99; }
.skip:focus { left: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- แถบเมนู ---------- */
.nav { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar { display: flex; align-items: center; gap: 18px; min-height: 60px; }
.logo { font-weight: 800; font-size: 1.25rem; text-decoration: none; color: var(--ink) !important; white-space: nowrap; }
.menu { display: flex; align-items: center; gap: 18px; flex: 1; }
.links, .nav-right { display: flex; align-items: center; gap: 4px; }
.nav-right { margin-left: auto; gap: 10px; }
.links a, .nav-right > a:not(.btn) { color: var(--ink) !important; text-decoration: none; padding: 6px 9px; border-radius: 10px; white-space: nowrap; }
.links a:hover, .nav-right > a:not(.btn):hover { background: var(--soft); }
.links a.active { background: var(--brand-soft); color: var(--brand) !important; font-weight: 600; }
:root[data-theme="dark"] .links a.active { color: var(--link) !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .links a.active { color: var(--link) !important; } }
.me { max-width: 170px; display: inline-flex; gap: 6px; align-items: center; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkish { background: none; border: 0; color: var(--ink); text-decoration: underline; cursor: pointer; font: inherit; padding: 6px 4px; white-space: nowrap; }
.theme { background: var(--soft); border: 0; border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 1rem; }
.hamburger { display: none; margin-left: auto; background: var(--soft); border: 0; border-radius: 10px; width: 44px; height: 40px; cursor: pointer; padding: 10px; flex-direction: column; justify-content: space-between; }
.hamburger span { display: block; height: 3px; border-radius: 3px; background: var(--ink); }
.subnav { background: var(--soft); border-top: 1px solid var(--line); font-size: .92rem; }
.subnav .wrap { display: flex; gap: 6px; align-items: center; min-height: 40px; overflow-x: auto; scrollbar-width: none; }
.subnav a { color: var(--ink) !important; text-decoration: none; padding: 4px 10px; border-radius: 8px; white-space: nowrap; }
.subnav a.active { background: var(--card); font-weight: 600; }
.subnav .muted { white-space: nowrap; }
.subnav-admin { background: var(--warn-soft); }

@media (max-width: 1180px) {
  .hamburger { display: flex; }
  .menu { display: none; position: absolute; left: 0; right: 0; top: 60px; background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); flex-direction: column; align-items: stretch; padding: 10px 20px 16px; gap: 6px; }
  body.menu-open .menu { display: flex; }
  .links, .nav-right { flex-direction: column; align-items: stretch; gap: 2px; margin: 0; }
  .links a, .nav-right > a, .nav-right .linkish { padding: 10px 12px; text-align: left; }
  .nav-right { border-top: 1px solid var(--line); padding-top: 8px; }
  .nav-right .btn { text-align: center; }
  .me { max-width: none; }
  .theme { width: auto; height: 40px; }
}

/* ---------- ส่วนประกอบ ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.center { text-align: center; }
.narrow { max-width: 720px; margin-left: auto; margin-right: auto; }
.narrower { max-width: 460px; margin-left: auto; margin-right: auto; }
.muted { color: var(--mute); }
.small { font-size: .85rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 16px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
.stat .k { color: var(--mute); font-size: .85rem; }
.stat .v { font-size: 1.7rem; font-weight: 800; line-height: 1.3; }
.stat .s { font-size: .82rem; color: var(--mute); }
@media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } .stat .v { font-size: 1.35rem; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--brand); color: var(--brand-ink) !important; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 42px; transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; filter: none; }
.btn-ghost { background: var(--card); color: var(--ink) !important; border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--soft); }
.btn-danger { background: var(--bad); color: #fff !important; }
:root[data-theme="dark"] .btn-danger { background: #c62f45; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-danger { background: #c62f45; } }
.btn-sm { padding: 6px 12px; min-height: 34px; font-size: .9rem; border-radius: 10px; }
.btn-lg { padding: 14px 24px; font-size: 1.1rem; min-height: 54px; }
.btn-block { width: 100%; }
.link-danger { color: var(--bad) !important; background: none; border: 0; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.actions a, .actions button.linkish { font-size: .92rem; }

label { display: block; font-weight: 500; margin: 10px 0 4px; }
label.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; margin: 6px 14px 6px 0; cursor: pointer; }
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--brand); }
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.form-grid { display: grid; gap: 0 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 12px; margin: 10px 0; }
legend { font-weight: 600; padding: 0 6px; }
.thai-date-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.thai-date-row select { width: auto; min-width: 72px; }
.err { color: var(--bad); margin: 8px 0 0; min-height: 1.2em; }
.note { background: var(--warn-soft); border: 1px solid var(--line); border-left: 5px solid var(--warn); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
.info { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }

.badge { display: inline-block; font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); font-weight: 500; white-space: nowrap; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-brand { background: var(--brand-soft); color: var(--brand); }
:root[data-theme="dark"] .badge-brand { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge-brand { color: var(--link); } }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; background: var(--soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }

.list { list-style: none; padding: 0; margin: 0; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.list li + li { margin-top: 8px; }
.list .grow { flex: 1; min-width: 0; }

.loading { padding: 60px 0; text-align: center; color: var(--mute); }
.empty { padding: 26px; text-align: center; color: var(--mute); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- หน้าแรก ---------- */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 44px 32px; background: linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 55%, var(--accent) 130%); color: #fff; box-shadow: var(--shadow); }
.hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 .2em; }
.hero p { font-size: 1.1rem; max-width: 560px; opacity: .95; }
.hero .btn { background: #fff; color: var(--hero-a) !important; }
.hero .btn-ghost { background: rgba(255, 255, 255, .15); color: #fff !important; border-color: rgba(255, 255, 255, .4); }
.hero-art { position: absolute; right: 24px; bottom: -10px; font-size: 7rem; line-height: 1; opacity: .95; animation: float 5s ease-in-out infinite; }
.hero-art span { display: inline-block; }
@keyframes float { 50% { transform: translateY(-12px) rotate(-3deg); } }
@media (max-width: 700px) { .hero { padding: 30px 22px; } .hero-art { font-size: 4rem; opacity: .35; } }
.features { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 22px 0; }
.feature { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.feature .ic { font-size: 1.8rem; }

/* ---------- การ์ดเกม ---------- */
.game-card { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink) !important; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden; }
.game-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.game-card .ic { font-size: 2rem; line-height: 1; }
.game-card .meta { font-size: .82rem; color: var(--mute); }
.game-card h3 { font-size: 1.05rem; }
.game-card p { margin: 0; color: var(--mute); font-size: .92rem; flex: 1; }
.filters { display: grid; gap: 10px; grid-template-columns: 2fr repeat(4, 1fr) auto; align-items: end; }
@media (max-width: 860px) { .filters { grid-template-columns: 1fr 1fr; } .filters .grow { grid-column: 1 / -1; } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.pager { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 20px 0; }

/* ---------- เล่นเกม ---------- */
.play { max-width: 720px; margin: 0 auto; }
.play-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--mute); font-size: .9rem; }
.progress { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; margin: 8px 0 16px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent)); border-radius: inherit; transition: width .35s; }
.q-prompt { font-size: 1.3rem; font-weight: 700; margin: 6px 0 16px; }
.q-img { display: block; max-height: 240px; margin: 0 auto 14px; border-radius: 14px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--card); border: 2px solid var(--line); color: var(--ink); border-radius: 14px; padding: 14px 16px; font: inherit; font-size: 1.05rem; cursor: pointer; transition: border-color .15s, background .15s, transform .08s; min-height: 54px; }
.opt:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.picked { border-color: var(--brand); background: var(--brand-soft); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .btn { min-height: 64px; font-size: 1.2rem; }
.tf .btn-no { background: var(--bad); }
:root[data-theme="dark"] .tf .btn-no { background: #c62f45; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tf .btn-no { background: #c62f45; } }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-weight: 600; animation: pop .25s ease-out; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--soft); color: var(--ink); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.order-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.order-list li { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.order-list li .n { color: var(--mute); width: 1.5em; text-align: right; }
.order-list li .t { flex: 1; }
.order-list li.right { border-color: var(--ok); background: var(--ok-soft); }
.order-list li.wrong { border-color: var(--bad); background: var(--bad-soft); }
.icon-btn { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; min-width: 42px; height: 40px; cursor: pointer; font: inherit; color: var(--ink); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.tiles { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; min-height: 52px; }
.tile { min-width: 46px; height: 50px; padding: 0 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: transform .1s; }
.tile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--brand); }
.tile:disabled { opacity: .25; cursor: default; }
.answer-slot { min-height: 56px; border: 2px dashed var(--line); border-radius: 14px; padding: 4px 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.answer-slot .tile { background: var(--brand-soft); border-color: var(--brand); }
.memory { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
@media (max-width: 520px) { .memory { grid-template-columns: repeat(3, 1fr); } }
.mcard { aspect-ratio: 4/3; border-radius: 14px; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: clamp(.8rem, 2.6vw, 1.05rem); perspective: 600px; background: none; padding: 0; color: var(--ink); }
.mcard .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.up .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .f, .mcard .b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; backface-visibility: hidden; padding: 6px; text-align: center; overflow-wrap: anywhere; }
.mcard .f { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-size: 1.6rem; }
.mcard .b { background: var(--card); border: 2px solid var(--line); transform: rotateY(180deg); }
.mcard.done .b { border-color: var(--ok); background: var(--ok-soft); }
.result-big { font-size: 2.2rem; font-weight: 800; margin: 0; }
.review { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; font-size: .95rem; }
.review li { display: flex; gap: 8px; align-items: baseline; }
.new-badge { display: flex; gap: 12px; align-items: center; background: var(--warn-soft); border-radius: 14px; padding: 10px 14px; margin: 10px 0; animation: pop .4s; }
.new-badge .ic { font-size: 2rem; }

/* ---------- แบบทดสอบ ---------- */
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.qcard + .qcard { margin-top: 14px; }
.qcard .qh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; color: var(--mute); font-size: .88rem; }
.qcard .qp { font-weight: 600; font-size: 1.05rem; margin: 6px 0 10px; white-space: pre-wrap; }
.qcard .choice { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; cursor: pointer; font-weight: 400; }
.qcard .choice:hover { background: var(--soft); }
.qcard .choice input { flex: none; }
.fill-line { line-height: 2.6; }
.fill-line input { display: inline-block; width: 160px; min-height: 38px; padding: 4px 10px; margin: 0 4px; }
.match-row { display: grid; grid-template-columns: 1fr auto 1.4fr; gap: 10px; align-items: center; margin: 6px 0; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; padding: 10px; background: var(--soft); border-radius: 12px; }
.bank .w { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 6px 12px; font: inherit; cursor: pointer; }
.bank .w:disabled { opacity: .35; cursor: default; }
.slot { display: inline-flex; min-width: 120px; min-height: 36px; align-items: center; justify-content: center; border: 2px dashed var(--brand); border-radius: 10px; padding: 2px 10px; margin: 0 4px; cursor: pointer; background: var(--brand-soft); font: inherit; color: var(--ink); vertical-align: middle; }
.slot.empty { color: var(--mute); }
.res-item { border-left: 5px solid var(--line); }
.res-item.ok { border-left-color: var(--ok); }
.res-item.no { border-left-color: var(--bad); }
.res-item.wait { border-left-color: var(--warn); }

/* ---------- ตัวสร้าง ---------- */
.builder-q { position: relative; }
.builder-q .qtools { display: flex; gap: 6px; }
.opt-edit { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.opt-edit input[type="text"] { flex: 1; }
.pair-edit { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin: 6px 0; }
.sticky-bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 1px solid var(--line); margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; z-index: 5; }
.thumb { max-height: 90px; border-radius: 10px; vertical-align: middle; }

/* ---------- แดชบอร์ด ---------- */
.hello { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.xpbar { height: 14px; background: var(--soft); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
.xpbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent)); border-radius: inherit; }
.badges { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.bdg { text-align: center; padding: 14px 10px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); }
.bdg .ic { font-size: 2rem; }
.bdg.locked { opacity: .5; filter: grayscale(1); }
.bdg .n { font-weight: 600; font-size: .92rem; }
.bdg .d { font-size: .78rem; color: var(--mute); }
.bars { margin: 0; }
.bars-plot { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 18px; }
.bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.bar { width: 100%; max-width: 46px; background: linear-gradient(180deg, var(--brand-2), var(--brand)); border-radius: 8px 8px 3px 3px; }
.bar-val { font-size: .75rem; color: var(--mute); min-height: 1.1em; }
.bar-label { font-size: .72rem; color: var(--mute); margin-top: 4px; white-space: nowrap; }

/* ---------- แข่งสด ---------- */
.pin-big { font-size: clamp(2.6rem, 9vw, 4.4rem); font-weight: 800; letter-spacing: .12em; text-align: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
.qr { display: block; margin: 8px auto; width: 220px; height: 220px; border-radius: 12px; background: #fff; padding: 6px; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player-chip { padding: 6px 12px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); animation: pop .3s; display: inline-flex; gap: 6px; align-items: center; }
.player-chip.red { border-color: #c62f45; } .player-chip.blue { border-color: #1d5fd6; }
.player-chip.off { opacity: .5; }
.player-chip button { background: none; border: 0; cursor: pointer; color: var(--mute); font-size: 1rem; padding: 0 2px; }
.live-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .live-opts { grid-template-columns: 1fr; } }
.live-opt { border: 0; border-radius: 16px; color: #fff; font: inherit; font-weight: 700; font-size: 1.15rem; padding: 18px; min-height: 76px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; transition: transform .08s, opacity .2s; }
.live-opt:active { transform: scale(.98); }
.live-opt .sh { font-size: 1.3rem; }
.live-opt.c0 { background: var(--opt-red); } .live-opt.c1 { background: var(--opt-blue); } .live-opt.c2 { background: var(--opt-yellow); } .live-opt.c3 { background: var(--opt-green); }
.live-opt.c4 { background: #6b3fa0; } .live-opt.c5 { background: #0f766e; }
.live-opt.dim { opacity: .35; }
.live-opt.sel { outline: 4px solid var(--ink); outline-offset: 2px; }
.live-opt .cnt { margin-left: auto; font-size: 1.2rem; }
.live-big { font-size: clamp(1.3rem, 3.5vw, 2rem); font-weight: 800; text-align: center; margin: 8px 0 16px; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.team { border-radius: 14px; padding: 12px; color: #fff; text-align: center; font-weight: 700; }
.team.red { background: #c62f45; } .team.blue { background: #1d5fd6; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 20px 0; }
.podium .p { text-align: center; width: 120px; }
.podium .blk { border-radius: 12px 12px 0 0; background: linear-gradient(180deg, var(--brand-2), var(--brand)); color: #fff; font-weight: 800; font-size: 1.6rem; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; animation: rise .6s ease-out; }
@keyframes rise { from { transform: scaleY(0); transform-origin: bottom; } }

/* ---------- ส่วนท้าย / แจ้งเตือน / กล่องโต้ตอบ ---------- */
.foot { display: flex; gap: 16px; color: var(--mute); font-size: .9rem; padding: 24px 20px 40px; border-top: 1px solid var(--line); margin-top: 20px; }
.foot a { color: var(--mute) !important; }
#toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 100; width: min(92vw, 420px); }
.toast { background: #1f1b3a; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); animation: pop .2s; transition: opacity .3s; }
.toast-bad { background: #a3203a; }
.toast.out { opacity: 0; }
dialog.modal { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 20px; width: min(92vw, 440px); }
dialog.modal::backdrop { background: rgba(10, 8, 25, .55); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 2.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.prose { max-width: 720px; margin: 0 auto; }
.prose li { margin: 4px 0; }
code, pre { font-family: ui-monospace, Consolas, monospace; }
pre { background: var(--soft); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
.pin-input { font-size: 2rem; text-align: center; letter-spacing: .3em; font-weight: 700; }
.pin-input::placeholder { letter-spacing: normal; font-size: 1.1rem; font-weight: 400; }

/* ================= ธีมสี (ปุ่มสีหลักใช้ตัวอักษรขาว ผ่านเกณฑ์ WCAG AA ทุกธีม) ================= */
:root { --brand-2: #8b6cff; --hero-a: #4b2fe0; --hero-b: #7a4dff; }
:root[data-palette="ocean"] { --brand: #0b63c5; --brand-2: #4ea3f1; --hero-a: #0a4f9e; --hero-b: #1f7fe0; --brand-soft: #e3f0ff; --accent: #22c3e6; --link: #0a56ab; --soft: #eaf3fc; --bg: #f3f8fe; --line: #d9e7f6; }
:root[data-palette="forest"] { --brand: #15803d; --brand-2: #4cbb6c; --hero-a: #11652f; --hero-b: #1f9a4c; --brand-soft: #dcfce7; --accent: #a3d630; --link: #166534; --soft: #eaf7ee; --bg: #f3faf5; --line: #d6ecdc; }
:root[data-palette="sunset"] { --brand: #c2410c; --brand-2: #f08a3e; --hero-a: #9a3412; --hero-b: #dd5b16; --brand-soft: #ffedd5; --accent: #f5b301; --link: #9a3412; --soft: #fdf1e6; --bg: #fff8f2; --line: #f4e0cf; }
:root[data-palette="sakura"] { --brand: #be185d; --brand-2: #ec5f9f; --hero-a: #9d174d; --hero-b: #d6307a; --brand-soft: #fce7f3; --accent: #f9a8d4; --link: #9d174d; --soft: #fcedf5; --bg: #fff6fa; --line: #f5dbe8; }
:root[data-palette="emerald"] { --brand: #0f766e; --brand-2: #3cb8ac; --hero-a: #115e59; --hero-b: #138a80; --brand-soft: #ccfbf1; --accent: #5eead4; --link: #115e59; --soft: #e6f6f3; --bg: #f2fbf9; --line: #d2ece7; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-palette="ocean"] { --brand-soft: #12304f; --link: #8cc4ff; --soft: #172636; --bg: #0e1620; --card: #15202d; --line: #24384d; }
  :root:not([data-theme="light"])[data-palette="forest"] { --brand-soft: #133524; --link: #86efac; --soft: #172a1f; --bg: #0e1712; --card: #15221a; --line: #23392b; }
  :root:not([data-theme="light"])[data-palette="sunset"] { --brand-soft: #3b2112; --link: #fdba74; --soft: #2c1e16; --bg: #18110d; --card: #241913; --line: #3d2c20; }
  :root:not([data-theme="light"])[data-palette="sakura"] { --brand-soft: #3d1528; --link: #f9a8d4; --soft: #2d1a24; --bg: #180e13; --card: #24161d; --line: #3f2532; }
  :root:not([data-theme="light"])[data-palette="emerald"] { --brand-soft: #0f2f2d; --link: #5eead4; --soft: #15292a; --bg: #0c1615; --card: #132120; --line: #213a38; }
}
:root[data-theme="dark"][data-palette="ocean"] { --brand-soft: #12304f; --link: #8cc4ff; --soft: #172636; --bg: #0e1620; --card: #15202d; --line: #24384d; }
:root[data-theme="dark"][data-palette="forest"] { --brand-soft: #133524; --link: #86efac; --soft: #172a1f; --bg: #0e1712; --card: #15221a; --line: #23392b; }
:root[data-theme="dark"][data-palette="sunset"] { --brand-soft: #3b2112; --link: #fdba74; --soft: #2c1e16; --bg: #18110d; --card: #241913; --line: #3d2c20; }
:root[data-theme="dark"][data-palette="sakura"] { --brand-soft: #3d1528; --link: #f9a8d4; --soft: #2d1a24; --bg: #180e13; --card: #24161d; --line: #3f2532; }
:root[data-theme="dark"][data-palette="emerald"] { --brand-soft: #0f2f2d; --link: #5eead4; --soft: #15292a; --bg: #0c1615; --card: #132120; --line: #213a38; }

/* ขนาดตัวอักษร */
:root[data-font="sm"] { font-size: 93.75%; }
:root[data-font="lg"] { font-size: 112.5%; }
:root[data-font="xl"] { font-size: 125%; }
/* ตัวอักษรอ่านง่าย: เว้นระยะมากขึ้น */
:root[data-dyslexic="1"] body { letter-spacing: .03em; word-spacing: .12em; line-height: 1.85; }
/* ความต่างสีสูง */
:root[data-contrast="high"] { --mute: var(--ink); --line: #6b6890; }
:root[data-contrast="high"] .card, :root[data-contrast="high"] .opt, :root[data-contrast="high"] input, :root[data-contrast="high"] select, :root[data-contrast="high"] textarea { border-width: 2px; }
:root[data-contrast="high"] a { text-decoration-thickness: 2px; }
/* ลดการเคลื่อนไหว */
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

/* ================= หน้าตั้งค่าการแสดงผล ================= */
.seg { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--ink); font: inherit; padding: 8px 14px; border-radius: 9px; cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 700; color: var(--brand); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: var(--link); } }
.palettes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pal { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px; padding: 10px; cursor: pointer; font: inherit; text-align: left; transition: transform .12s, border-color .12s; }
.pal:hover { transform: translateY(-2px); }
.pal[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.pal .sw { height: 56px; border-radius: 10px; margin-bottom: 8px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px; font-size: 1.5rem; }
.pal .nm { font-weight: 600; font-size: .92rem; }
.pal .ok { float: right; color: var(--brand); font-weight: 800; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-row:first-of-type { border-top: 0; }
.set-row .t { flex: 1; min-width: 200px; }
.set-row .t b { display: block; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(22px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.preview { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.preview .ph { background: linear-gradient(135deg, var(--hero-a), var(--hero-b) 60%, var(--accent) 140%); color: #fff; padding: 16px 18px; }
.preview .pb { background: var(--bg); padding: 14px 18px; display: grid; gap: 10px; }
.settings-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
.settings-nav a { text-decoration: none; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink) !important; font-size: .92rem; }

/* ================= ธีมพิเศษ (ซื้อจากร้านค้า) ================= */
:root[data-palette="candy"] { --brand: #a21caf; --brand-2: #d64fe3; --hero-a: #86198f; --hero-b: #c026d3; --brand-soft: #fae8ff; --accent: #fb923c; --link: #86198f; --soft: #fbeefd; --bg: #fff7fe; --line: #f2dcf5; }
:root[data-palette="galaxy"] { --brand: #6d28d9; --brand-2: #9f67ff; --hero-a: #3b0764; --hero-b: #6d28d9; --brand-soft: #ede9fe; --accent: #22d3ee; --link: #5b21b6; --soft: #f0ecfd; --bg: #f7f5ff; --line: #e2dbf8; }
:root[data-palette="gold"] { --brand: #a16207; --brand-2: #d99a1a; --hero-a: #713f12; --hero-b: #a16207; --brand-soft: #fef3c7; --accent: #fbbf24; --link: #854d0e; --soft: #fbf3e2; --bg: #fffbf0; --line: #f1e3c2; }
:root[data-palette="aurora"] { --brand: #0e7490; --brand-2: #34b3cf; --hero-a: #134e4a; --hero-b: #0e7490; --brand-soft: #cffafe; --accent: #a3e635; --link: #155e75; --soft: #e8f6f8; --bg: #f3fbfc; --line: #d3ecf0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-palette="candy"] { --brand-soft: #3a1240; --link: #f0abfc; --soft: #2a1730; --bg: #160c18; --card: #221425; --line: #3d2442; }
  :root:not([data-theme="light"])[data-palette="galaxy"] { --brand-soft: #2a1a52; --link: #c4b5fd; --soft: #1d1836; --bg: #0b0918; --card: #151229; --line: #2b2550; }
  :root:not([data-theme="light"])[data-palette="gold"] { --brand-soft: #3a2a08; --link: #fcd34d; --soft: #2a2213; --bg: #15110a; --card: #211b10; --line: #3d321c; }
  :root:not([data-theme="light"])[data-palette="aurora"] { --brand-soft: #0c3540; --link: #67e8f9; --soft: #12272c; --bg: #0a1416; --card: #111f23; --line: #1f3a40; }
}
:root[data-theme="dark"][data-palette="candy"] { --brand-soft: #3a1240; --link: #f0abfc; --soft: #2a1730; --bg: #160c18; --card: #221425; --line: #3d2442; }
:root[data-theme="dark"][data-palette="galaxy"] { --brand-soft: #2a1a52; --link: #c4b5fd; --soft: #1d1836; --bg: #0b0918; --card: #151229; --line: #2b2550; }
:root[data-theme="dark"][data-palette="gold"] { --brand-soft: #3a2a08; --link: #fcd34d; --soft: #2a2213; --bg: #15110a; --card: #211b10; --line: #3d321c; }
:root[data-theme="dark"][data-palette="aurora"] { --brand-soft: #0c3540; --link: #67e8f9; --soft: #12272c; --bg: #0a1416; --card: #111f23; --line: #1f3a40; }

/* ================= พื้นหลังพิเศษ ================= */
:root[data-bg="dots"] body { background-image: radial-gradient(color-mix(in srgb, var(--brand) 14%, transparent) 1.5px, transparent 1.6px); background-size: 22px 22px; }
:root[data-bg="stars"] body { background-image: radial-gradient(color-mix(in srgb, var(--accent) 45%, transparent) 1px, transparent 1.4px), radial-gradient(color-mix(in srgb, var(--brand) 30%, transparent) 1.6px, transparent 2px); background-size: 37px 37px, 89px 89px; background-position: 0 0, 20px 40px; }
:root[data-bg="waves"] body { background-image: repeating-radial-gradient(circle at 0 100%, transparent 0 18px, color-mix(in srgb, var(--brand) 8%, transparent) 18px 20px); background-size: 60px 60px; }
:root[data-bg="space"] body { background: radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 55%), radial-gradient(ellipse at 90% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 50%), radial-gradient(#fff9 1px, transparent 1.3px) 0 0 / 53px 53px, var(--bg); background-attachment: fixed; }

/* ================= อวาตาร์และกรอบ ================= */
.ava { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--soft); font-size: 1em; line-height: 1; flex: none; position: relative; vertical-align: middle; }
.ava.lg { font-size: 2.2rem; width: 1.8em; height: 1.8em; }
.ava.xl { font-size: 3.4rem; width: 1.7em; height: 1.7em; }
.ava[class*="fr-"]::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; padding: 3px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.ava.fr-mint::before { background: #2dd4bf; }
.ava.fr-sky::before { background: #38bdf8; }
.ava.fr-rainbow::before { background: conic-gradient(#ef4444, #f59e0b, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444); }
.ava.fr-fire::before { background: linear-gradient(0deg, #dc2626, #f97316, #facc15); }
.ava.fr-gold::before { background: linear-gradient(135deg, #a16207, #fde68a, #ca8a04, #fef3c7); box-shadow: 0 0 10px #facc1580; }
.ava.fr-galaxy::before { background: conic-gradient(#6d28d9, #22d3ee, #ec4899, #6d28d9); animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.title-tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 10px; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); color: #fff; vertical-align: middle; }
.coins { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; background: var(--warn-soft); color: var(--ink); padding: 3px 10px; border-radius: 999px; text-decoration: none; white-space: nowrap; }

/* ================= ร้านค้า ================= */
.shop-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.wallet { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 16px; box-shadow: var(--shadow); }
.wallet .amt { font-size: 1.6rem; font-weight: 800; }
.boxes { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.lootbox { position: relative; overflow: hidden; border-radius: 20px; padding: 18px; color: #fff; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); }
.lootbox.gold { background: linear-gradient(135deg, #713f12, #b7791f 60%, #f6c453); }
.lootbox .big { font-size: 3.6rem; line-height: 1; animation: float 3.5s ease-in-out infinite; display: inline-block; }
.lootbox h3 { color: #fff; margin: 6px 0 2px; }
.lootbox p { margin: 0 0 10px; opacity: .92; font-size: .9rem; }
.lootbox .btn { background: #fff; color: #1f1b3a !important; }
.lootbox .btn.free { background: #fde047; }
.lootbox details { font-size: .85rem; margin-top: 10px; }
.lootbox details summary { cursor: pointer; }
.odds { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; margin-top: 6px; background: rgba(0,0,0,.18); padding: 8px 10px; border-radius: 10px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 12px; }
.items { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.item { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 10px 12px; }
.item.r-rare { border-color: #60a5fa; } .item.r-epic { border-color: #c084fc; } .item.r-legendary { border-color: #f59e0b; box-shadow: 0 0 0 3px #f59e0b33; }
.item .rar { position: absolute; top: 8px; left: 8px; font-size: .68rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--mute); }
.item.r-rare .rar { background: #dbeafe; color: #1d4ed8; } .item.r-epic .rar { background: #f3e8ff; color: #7e22ce; } .item.r-legendary .rar { background: #fef3c7; color: #92400e; }
.item .vis { height: 70px; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; }
.item .nm { font-weight: 600; font-size: .92rem; min-height: 2.6em; display: flex; align-items: center; }
.item .btn { width: 100%; }
.item.equipped { outline: 3px solid var(--brand); outline-offset: 2px; }
.swatch { width: 74px; height: 50px; border-radius: 12px; }
.bg-prev { width: 90px; height: 60px; border-radius: 12px; border: 1px solid var(--line); background-color: var(--bg); }
.bg-prev.dots { background-image: radial-gradient(color-mix(in srgb, var(--brand) 30%, transparent) 2px, transparent 2.2px); background-size: 12px 12px; }
.bg-prev.stars { background-image: radial-gradient(var(--accent) 1px, transparent 1.4px), radial-gradient(var(--brand) 1.6px, transparent 2px); background-size: 14px 14px, 25px 25px; }
.bg-prev.waves { background-image: repeating-radial-gradient(circle at 0 100%, transparent 0 8px, color-mix(in srgb, var(--brand) 25%, transparent) 8px 10px); background-size: 28px 28px; }
.bg-prev.space { background: radial-gradient(#fff 1px, transparent 1.3px) 0 0 / 12px 12px, linear-gradient(135deg, #1e1b4b, #6d28d9); }

/* เปิดกล่อง */
dialog.boxmodal { border: 0; background: transparent; padding: 0; width: min(92vw, 420px); overflow: visible; }
dialog.boxmodal::backdrop { background: rgba(10, 8, 25, .75); }
.reveal { background: var(--card); color: var(--ink); border-radius: 24px; padding: 26px 20px 20px; text-align: center; position: relative; overflow: hidden; }
.reveal .chest { font-size: 6rem; display: inline-block; animation: shake .5s ease-in-out infinite; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.05); } 75% { transform: rotate(12deg) scale(1.05); } }
.reveal .glow { position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent, var(--rc, #a78bfa) 20%, transparent 40%, var(--rc, #a78bfa) 60%, transparent 80%); animation: spin 3s linear infinite; opacity: .35; }
.reveal .inner { position: relative; }
.reveal .prize { font-size: 4.4rem; animation: popin .6s cubic-bezier(.2, 1.6, .4, 1); display: inline-flex; min-height: 1.2em; align-items: center; justify-content: center; }
@keyframes popin { from { transform: scale(0) rotate(-30deg); opacity: 0; } }
.reveal.r-common { --rc: #94a3b8; } .reveal.r-rare { --rc: #3b82f6; } .reveal.r-epic { --rc: #a855f7; } .reveal.r-legendary { --rc: #f59e0b; }
.rar-name { font-weight: 800; letter-spacing: .05em; }
.reveal.r-rare .rar-name { color: #2563eb; } .reveal.r-epic .rar-name { color: #9333ea; } .reveal.r-legendary .rar-name { color: #d97706; }
.confetti .emo { position: absolute; top: -40px; font-size: 1.6rem; animation: fall 3s ease-in forwards; }

/* ================= มือถือ ================= */
button, .btn, .opt, .tile, .mcard, .live-opt, .chip { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font-size: max(16px, 1rem); } /* กัน iOS ซูมเข้าเองตอนแตะช่องกรอก */
.bottom-nav { display: none; }
@media (max-width: 760px) {
  main.wrap { padding-top: 16px; padding-left: 14px; padding-right: 14px; }
  .wrap { padding-left: 14px; padding-right: 14px; }
  .topbar { min-height: 54px; }
  .menu { top: 54px; max-height: calc(100vh - 54px); overflow-y: auto; }
  .card { padding: 14px 14px; }
  h1 { font-size: 1.45rem; }
  .hero { padding: 26px 18px; border-radius: 20px; }
  .hero .row { flex-direction: column; align-items: stretch; }
  .hero .btn-lg { width: 100%; }
  .grid { grid-template-columns: 1fr; gap: 12px; }
  .palettes { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pal .sw { height: 44px; }
  .items { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .item { padding: 12px 8px 10px; }
  .item .vis { height: 56px; font-size: 2.2rem; }
  .badges { grid-template-columns: repeat(2, 1fr); }
  .memory { grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .mcard { font-size: clamp(.7rem, 3.3vw, .9rem); }
  .mcard .f { font-size: 1.2rem; }
  .q-prompt { font-size: 1.15rem; }
  .opt { padding: 12px 14px; }
  .live-opt { min-height: 64px; padding: 14px; font-size: 1.05rem; }
  .pin-big { letter-spacing: .06em; }
  .qr { width: 190px; height: 190px; }
  .fill-line input { width: 130px; }
  .match-row { grid-template-columns: 1fr auto 1.3fr; gap: 6px; }
  .set-row .seg { width: 100%; }
  .set-row .seg button { flex: 1; padding: 8px 6px; }
  .wallet { width: 100%; }
  .lootbox .big { font-size: 2.8rem; }
  .podium .p { width: 96px; }
  /* ป้ายวันที่ในกราฟ: แสดงทุก 2 วันเมื่อมีหลายแท่ง */
  .bars-plot { gap: 3px; }
  .bars-plot:has(.bar-col:nth-child(9)) .bar-col:nth-child(even) .bar-label { visibility: hidden; }
  .bar-label { font-size: .64rem; }
  /* ปุ่มเล็กให้แตะง่าย */
  .linkish, .link-danger, .actions a { min-height: 40px; display: inline-flex; align-items: center; }
  .player-chip button { min-width: 32px; min-height: 32px; font-size: 1.1rem; }
  .icon-btn { min-width: 44px; height: 44px; }
  /* แถบเมนูด้านล่าง */
  body.has-bottom-nav { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
  body.has-bottom-nav .bottom-nav { display: grid; }
  body.has-bottom-nav .sticky-bar { bottom: calc(64px + env(safe-area-inset-bottom)); }
  body.has-bottom-nav #toasts { bottom: calc(78px + env(safe-area-inset-bottom)); }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 54px; text-decoration: none; color: var(--mute) !important; font-size: .7rem; border-radius: 12px; }
  .bottom-nav a .i { font-size: 1.35rem; line-height: 1.2; }
  .bottom-nav a.active { color: var(--brand) !important; background: var(--brand-soft); font-weight: 700; }
  :root[data-theme="dark"] .bottom-nav a.active { color: var(--link) !important; }
  .foot { padding-bottom: 20px; flex-wrap: wrap; }
}
@media (max-width: 760px) and (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bottom-nav a.active { color: var(--link) !important; } }
@media (max-width: 380px) { .stats { gap: 8px; } .stat { padding: 10px 8px; } .stat .k { font-size: .76rem; } .items { gap: 8px; } }
/* ระหว่างเล่นแข่งสด: ไม่ให้ลากแล้วรีเฟรชหน้าโดยไม่ตั้งใจ */
body.playing { overscroll-behavior-y: contain; }
@media (display-mode: standalone) { .nav { padding-top: env(safe-area-inset-top); } }
.install-card { display: flex; gap: 12px; align-items: center; }
.install-card .ic { font-size: 2.2rem; }

/* ===== หน้าจอสรุปผลหลังจบเกม (แถบเฉียง ดาวระเบิด ตราแรงก์) ===== */
html.vs-open { overflow: hidden; }
.vs { position: fixed; inset: 0; z-index: 90; color: #fff; overflow: hidden auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  --hot: var(--brand); --hot2: var(--accent); --gold: #ffd23f; --ink0: #0c0a14;
  display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 16px max(56px, calc(env(safe-area-inset-bottom) + 48px));
  font-family: inherit; animation: vsIn .25s ease-out both; }
.vs-try { --hot2: #8f8aa8; }
.vs-bg { position: fixed; inset: 0; background:
    radial-gradient(circle at 78% 30%, color-mix(in srgb, var(--hot) 40%, transparent), transparent 55%),
    repeating-linear-gradient(-28deg, rgba(255,255,255,.035) 0 14px, transparent 14px 30px),
    var(--ink0); }
.vs-bg::after { content: ""; position: absolute; inset: 0; opacity: .22; background-image: radial-gradient(rgba(255,255,255,.55) 1.2px, transparent 1.6px); background-size: 9px 9px;
  -webkit-mask-image: linear-gradient(115deg, transparent 35%, #000 70%); mask-image: linear-gradient(115deg, transparent 35%, #000 70%); }
.vs-shard { position: fixed; pointer-events: none; }
.vs-shard.s1 { left: -10%; right: -10%; top: 30%; height: 34%; background: var(--hot); clip-path: polygon(0 38%, 100% 0, 100% 46%, 64% 58%, 72% 70%, 0 100%); animation: vsSlash .45s .05s cubic-bezier(.2,.9,.3,1.2) both; }
.vs-shard.s2 { left: -10%; right: -10%; top: 44%; height: 18%; background: var(--hot2); clip-path: polygon(0 60%, 100% 0, 100% 30%, 0 100%); opacity: .9; animation: vsSlash .45s .15s cubic-bezier(.2,.9,.3,1.2) both; }
.vs-shard.s3 { right: -6%; top: -8%; width: 46%; height: 60%; background: #fff; opacity: .07; clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 60%); animation: vsFade .6s .2s both; }
.vs-sparks { position: fixed; inset: 0; pointer-events: none; }
.vs-spark { position: absolute; color: #fff; font-style: normal; opacity: 0; animation: vsTwinkle 2.4s var(--d) ease-in-out infinite; text-shadow: 0 0 8px rgba(255,255,255,.8); }

.vs-stage { position: relative; width: min(1060px, 100%); display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px 40px; align-items: center; }
.vs-game { margin: 0 0 4px; font-weight: 700; letter-spacing: .02em; opacity: .85; transform: skewX(-10deg); animation: vsPop .35s .1s both; }
.vs-title { margin: 0; line-height: 1.02; font-size: clamp(2.6rem, 8vw, 5.4rem); font-weight: 800; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.vs-title span { display: inline-block; padding: .02em .22em .1em; transform-origin: left center; }
.vs-title .w1 { background: #fff; color: var(--ink0); transform: rotate(-4deg) skewX(-10deg); box-shadow: 7px 7px 0 var(--hot); animation: vsStampL .4s .2s cubic-bezier(.2,.9,.3,1.4) both; }
.vs-title .w2 { color: #fff; background: var(--ink0); border: 4px solid #fff; transform: rotate(3deg) skewX(-10deg) translateY(10px); box-shadow: 7px 7px 0 var(--hot2); animation: vsStampR .4s .34s cubic-bezier(.2,.9,.3,1.4) both; }
.vs-sub { margin: 22px 0 0; font-weight: 600; font-size: 1.05rem; background: rgba(0,0,0,.55); display: inline-block; padding: 4px 12px; transform: skewX(-10deg); animation: vsPop .35s .5s both; }

.vs-hero { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.vs-burst { position: relative; width: clamp(170px, 26vw, 230px); aspect-ratio: 1; flex: none; filter: drop-shadow(8px 8px 0 rgba(0,0,0,.6)); animation: vsBurst .55s .4s cubic-bezier(.2,.9,.3,1.5) both; }
.vs-burst::before, .vs-burst .in { position: absolute; inset: 0; clip-path: polygon(50.0% 0.0%, 58.9% 11.0%, 71.7% 5.0%, 72.4% 21.9%, 89.1% 18.8%, 86.0% 32.6%, 98.7% 38.9%, 86.0% 50.0%, 98.7% 61.1%, 86.0% 67.4%, 89.1% 81.2%, 72.4% 78.1%, 71.7% 95.0%, 58.9% 89.0%, 50.0% 100.0%, 42.0% 85.1%, 28.3% 95.0%, 25.1% 81.3%, 10.9% 81.2%, 17.6% 65.6%, 1.3% 61.1%, 10.0% 50.0%, 1.3% 38.9%, 17.6% 34.4%, 10.9% 18.8%, 25.1% 18.7%, 28.3% 5.0%, 42.0% 14.9%); }
.vs-burst::before { content: ""; background: var(--ink0); }
.vs-burst .in { inset: 9px; background: var(--gold); color: var(--ink0); display: grid; place-content: center; text-align: center; transform: rotate(-6deg); }
.vs-try .vs-burst .in { background: #e8e6f2; }
.vs-burst b { font-size: clamp(2.4rem, 6vw, 3.4rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.vs-burst small { font-weight: 700; font-size: .85rem; }
.vs-rank { display: grid; place-items: center; width: 116px; aspect-ratio: 1; border: 5px solid currentColor; border-radius: 18px; transform: rotate(12deg); background: rgba(0,0,0,.6);
  color: #fff; animation: vsStamp .5s 1.05s cubic-bezier(.2,.9,.3,1.3) both; box-shadow: 0 0 0 4px rgba(0,0,0,.6); }
.vs-rank b { font-size: 3.6rem; line-height: .9; font-weight: 800; font-style: italic; }
.vs-rank span { font-size: .75rem; font-weight: 700; margin-top: -6px; }
.vs-rank-S { color: var(--gold); text-shadow: 0 0 18px rgba(255,210,63,.7); }
.vs-rank-A { color: #ff8cc0; } .vs-rank-B { color: #9ad8ff; } .vs-rank-C { color: #b7f7c6; } .vs-rank-D { color: #c9c6d8; }

.vs-right { display: grid; gap: 12px; }
.vs-stat { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px 12px; padding: 10px 22px 12px 26px; background: #fff; color: var(--ink0);
  clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); box-shadow: inset 8px 0 0 var(--hot); animation: vsSlideIn .4s cubic-bezier(.2,.9,.3,1.2) both; }
.vs-stat:nth-child(1) { animation-delay: .65s; } .vs-stat:nth-child(2) { animation-delay: .75s; transform: translateX(-10px); }
.vs-stat:nth-child(3) { animation-delay: .85s; } .vs-stat:nth-child(4) { animation-delay: .95s; transform: translateX(-10px); }
.vs-stat:nth-child(even) { background: var(--ink0); color: #fff; box-shadow: inset 8px 0 0 var(--hot2), inset 0 0 0 3px #fff; }
.vs-stat .k { font-weight: 800; font-size: .95rem; transform: skewX(-10deg); }
.vs-stat b { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; font-style: italic; }
.vs-stat b small { font-size: 1rem; font-style: normal; opacity: .7; }
.vs-stat.coin b { color: #b07a00; } .vs-stat.xp b { color: var(--gold); }
.vs-stat .vs-bar { grid-column: 1 / -1; width: 100%; height: 8px; background: rgba(0,0,0,.12); display: block; transform: skewX(-20deg); }
.vs-stat .vs-bar i { display: block; height: 100%; width: var(--p); background: var(--hot); animation: vsGrow .9s 1s ease-out both; }
.vs-stat .pct { grid-column: 1 / -1; font-weight: 600; opacity: .75; }
.vs-badges { display: grid; gap: 8px; }
.vs-badge { display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: linear-gradient(100deg, var(--gold), #ffb020); color: var(--ink0); transform: rotate(-1.5deg);
  box-shadow: 5px 5px 0 rgba(0,0,0,.6); animation: vsStamp .45s 1.3s cubic-bezier(.2,.9,.3,1.4) both; }
.vs-badge .ic { font-size: 1.8rem; } .vs-badge small { display: block; font-weight: 700; font-size: .75rem; } .vs-badge b { font-size: 1.05rem; }
.vs-note { margin: 0; font-size: .9rem; background: rgba(0,0,0,.6); padding: 6px 12px; }
.vs-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; animation: vsPop .35s 1.2s both; }
.vs-btn { font: inherit; font-weight: 800; font-size: 1.05rem; cursor: pointer; border: 3px solid #fff; padding: 12px 22px; color: #fff; background: var(--hot);
  clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); padding-inline: 28px; transition: transform .12s, filter .12s; }
.vs-btn.alt { background: var(--ink0); }
.vs-btn:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.1); }
.vs-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; clip-path: none; }
.vs-hint { position: fixed; left: 16px; bottom: max(14px, env(safe-area-inset-bottom)); margin: 0; font-weight: 700; font-size: .85rem; opacity: .8; transform: skewX(-10deg);
  background: rgba(0,0,0,.6); padding: 4px 12px; border-radius: 999px; animation: vsBlink 1.6s 1.8s ease-in-out infinite both; }
.vs-out { animation: vsOut .26s ease-in forwards; }

@keyframes vsIn { from { opacity: 0; } }
@keyframes vsOut { to { opacity: 0; transform: scale(1.04); } }
@keyframes vsFade { from { opacity: 0; } }
@keyframes vsSlash { from { transform: translateX(-110%) skewX(-20deg); } }
@keyframes vsPop { from { opacity: 0; transform: translateY(12px) skewX(-10deg); } }
@keyframes vsStampL { from { opacity: 0; transform: rotate(-4deg) skewX(-10deg) scale(2.4); } }
@keyframes vsStampR { from { opacity: 0; transform: rotate(3deg) skewX(-10deg) translateY(10px) scale(2.4); } }
@keyframes vsBurst { from { opacity: 0; transform: scale(.2) rotate(-90deg); } }
@keyframes vsStamp { 0% { opacity: 0; transform: rotate(12deg) scale(3); } 70% { opacity: 1; transform: rotate(12deg) scale(.92); } }
@keyframes vsSlideIn { from { opacity: 0; transform: translateX(80px); } }
@keyframes vsGrow { from { width: 0; } }
@keyframes vsTwinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 50% { opacity: .9; transform: scale(1) rotate(45deg); } }
@keyframes vsBlink { 50% { opacity: .35; } }

@media (max-width: 760px) {
  .vs { place-items: start center; }
  .vs-stage { grid-template-columns: 1fr; gap: 18px; }
  .vs-title { font-size: clamp(2.3rem, 13vw, 3.4rem); }
  .vs-sub { margin-top: 16px; font-size: .95rem; }
  .vs-hero { justify-content: center; }
  .vs-burst { width: 170px; }
  .vs-rank { width: 96px; } .vs-rank b { font-size: 3rem; }
  .vs-stat { padding: 8px 18px 10px 22px; } .vs-stat b { font-size: 1.6rem; }
  .vs-stat:nth-child(2), .vs-stat:nth-child(4) { transform: none; }
  .vs-actions .vs-btn { flex: 1 1 100%; }
  .vs-hint { display: none; }
  .vs-shard.s1 { top: 18%; height: 26%; } .vs-shard.s2 { top: 30%; }
}

/* ===== การ์ดสรุปผลในหน้า (ต่อจากหน้าจอเต็ม) ===== */
.rs { --hot: var(--brand); --hot2: var(--accent); --gold: #ffd23f; --ink0: #0c0a14;
  position: relative; overflow: hidden; color: #fff; border-radius: 20px; padding: 26px 26px 22px; isolation: isolate;
  background: radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--hot) 45%, transparent), transparent 55%),
    repeating-linear-gradient(-28deg, rgba(255,255,255,.04) 0 12px, transparent 12px 26px), var(--ink0);
  box-shadow: 0 14px 40px rgba(0,0,0,.35); scroll-margin-top: 80px; }
.rs-try { --hot2: #8f8aa8; }
.rs::before { content: ""; position: absolute; z-index: -1; left: -10%; right: -10%; top: 60px; height: 150px; background: var(--hot);
  clip-path: polygon(0 40%, 100% 0, 100% 45%, 62% 60%, 70% 72%, 0 100%); opacity: .9; }
.rs::after { content: ""; position: absolute; z-index: -1; left: -10%; right: -10%; top: 120px; height: 70px; background: var(--hot2);
  clip-path: polygon(0 60%, 100% 0, 100% 30%, 0 100%); opacity: .85; }
.rs-head { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; }
.rs-title { margin: 0; font-size: clamp(2rem, 5.5vw, 3.2rem); line-height: 1.05; font-weight: 800; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.rs-title span { display: inline-block; padding: .02em .22em .1em; }
.rs-title .w1 { background: #fff; color: var(--ink0); transform: rotate(-4deg) skewX(-10deg); box-shadow: 6px 6px 0 var(--hot); }
.rs-title .w2 { background: var(--ink0); border: 3px solid #fff; transform: rotate(3deg) skewX(-10deg) translateY(8px); box-shadow: 6px 6px 0 var(--hot2); }
.rs-sub { margin: 18px 0 0; font-weight: 700; display: inline-block; background: rgba(0,0,0,.6); padding: 3px 12px; transform: skewX(-10deg); }
.rs-hero { display: flex; align-items: center; gap: 6px; }
.rs-burst { width: 150px; animation: none; }
.rs-burst b { font-size: 2.2rem; }
.rs-burst small { font-size: .75rem; }
.rs-rank { width: 92px; animation: none; } .rs-rank b { font-size: 2.8rem; }
.rs-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.rs-chip { background: #fff; color: var(--ink0); font-weight: 700; padding: 6px 16px; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); padding-inline: 20px; }
.rs-chip b { font-size: 1.15rem; font-style: italic; }
.rs-chip:nth-child(even) { background: var(--ink0); color: #fff; box-shadow: inset 0 0 0 2px #fff; }
.rs-chip.xp b { color: #a77800; } .rs-chip.xp:nth-child(even) b, .rs-chip.coin:nth-child(even) b { color: var(--gold); } .rs-chip.coin b { color: #a77800; }
.rs-chip.ok { background: #19c26b; color: #04210f; } .rs-chip.bad { background: #ff5c7a; color: #2a0510; box-shadow: none; }
.rs-badges { display: grid; gap: 8px; margin-top: 16px; max-width: 560px; }
.rs-badges .vs-badge { animation: none; } .rs-badges .vs-badge .small { font-size: .8rem; opacity: .8; }
.rs-note { margin: 14px 0 0; background: rgba(0,0,0,.55); padding: 6px 12px; font-size: .9rem; } .rs-note a { color: var(--gold); }
.rs-review { margin-top: 18px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.15); border-radius: 14px; padding: 10px 14px; }
.rs-review summary { cursor: pointer; font-weight: 800; padding: 4px 0; }
.rs-list { list-style: none; margin: 8px 0 2px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.rs-list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 8px 12px; background: rgba(0,0,0,.45); border-left: 6px solid #19c26b; }
.rs-list li.bad { border-left-color: #ff5c7a; }
.rs-list .n { grid-row: span 2; width: 30px; height: 30px; display: grid; place-items: center; font-weight: 800; background: #19c26b; color: #04210f; transform: skewX(-10deg); }
.rs-list li.bad .n { background: #ff5c7a; color: #2a0510; }
.rs-list .q { font-weight: 700; } .rs-list .a { font-size: .88rem; opacity: .85; }
.rs-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.rs-actions a.vs-btn { text-decoration: none; display: inline-flex; align-items: center; }
@media (max-width: 760px) {
  .rs { padding: 20px 16px 18px; border-radius: 16px; }
  .rs-head { justify-content: center; } .rs-hero { justify-content: center; width: 100%; }
  .rs-burst { width: 140px; } .rs-rank { width: 84px; }
  .rs-actions .vs-btn { flex: 1 1 100%; justify-content: center; }
}
.vs-counting { display: inline-block; animation: vsBump .18s ease-out infinite alternate; }
.vs-burst .vs-counting { color: var(--hot); }
@keyframes vsBump { to { transform: scale(1.12); } }
.tick-row { display: block; }
.tick-row .t { display: block; }
.tick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 10px; }
.tick-opt { display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; cursor: pointer; padding: 10px 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); transition: border-color .15s, transform .1s; }
.tick-opt:hover { border-color: var(--brand); transform: translateY(-1px); }
.tick-opt[aria-checked="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.tick-opt .ic { font-size: 1.4rem; } .tick-opt .nm { flex: 1; font-weight: 600; line-height: 1.3; }
.tick-opt .nm small { display: block; font-weight: 500; color: var(--mute); font-size: .75rem; }
.tick-opt .pl { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); color: var(--brand); font-size: .8rem; flex: none; }
.tick-opt[aria-checked="true"] .pl { background: var(--brand); color: #fff; }
.tick-del { justify-self: start; align-self: center; }

/* บัญชีออนไลน์ (เวอร์ชันเล่นบนเว็บ) */
.cloud-card { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--brand-soft); border: 1px solid var(--line); margin-bottom: 14px; }
.cloud-card .ic { font-size: 2rem; line-height: 1; }
.cloud-card.on { background: var(--ok-soft); }
.cloud-card b { word-break: break-all; }
.auth-wrap { padding-top: 10px; }
.auth-wrap .card { padding: 26px 26px 22px; }
.nav-login { white-space: nowrap; }
@media (max-width: 1180px) { .nav-right .nav-login { order: -1; } }

/* =====================================================================
   สไตล์หน้าเว็บ (data-skin บน <html>) — ใช้คู่กับธีมสีได้ทุกธีม
   classic = ค่าเริ่มต้น (ไม่มีกฎเพิ่ม)
   ===================================================================== */

/* ---------- 💥 คอมิกแอ็กชัน ---------- */
html[data-skin="comic"] { --sk-line: var(--ink); --sk-hard: color-mix(in srgb, var(--brand) 70%, #000); }
html[data-skin="comic"] body { font-family: "Kanit", "Noto Sans Thai", system-ui, sans-serif;
  background-image: radial-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 1.2px, transparent 1.6px); background-size: 11px 11px; }
html[data-skin="comic"] h1, html[data-skin="comic"] h2, html[data-skin="comic"] h3 { font-weight: 700; }
html[data-skin="comic"] main h1:not(.hero h1) { display: inline-block; transform: skewX(-8deg); background: linear-gradient(transparent 58%, color-mix(in srgb, var(--accent) 55%, transparent) 58% 92%, transparent 92%); padding: 0 .15em; }
html[data-skin="comic"] main h2:not(.vs-title, .rs-title) { display: inline-block; transform: skewX(-8deg); background: linear-gradient(transparent 60%, color-mix(in srgb, var(--accent) 40%, transparent) 60% 92%, transparent 92%); padding: 0 .15em; }
html[data-skin="comic"] .nav { border-bottom: 4px solid var(--sk-line); }
html[data-skin="comic"] .logo { font-style: italic; transform: skewX(-8deg); display: inline-block; }
html[data-skin="comic"] :is(.card, .feature, .stat, .game-card, .tick-opt, .pal, .item, .lootbox, .qcard, .mcard, .install-card) {
  border: 3px solid var(--sk-line); border-radius: 6px; box-shadow: 5px 5px 0 var(--sk-hard); }
html[data-skin="comic"] .card .card { box-shadow: 3px 3px 0 var(--sk-hard); }
html[data-skin="comic"] .game-card:hover { transform: translate(-2px, -3px) rotate(-.7deg); box-shadow: 9px 9px 0 var(--sk-hard); }
html[data-skin="comic"] .feature:nth-child(odd) { transform: rotate(-.8deg); } html[data-skin="comic"] .feature:nth-child(even) { transform: rotate(.6deg); }
html[data-skin="comic"] .btn { border: 3px solid var(--sk-line); border-radius: 4px; box-shadow: 4px 4px 0 var(--sk-hard); font-weight: 700; transform: skewX(-7deg); }
html[data-skin="comic"] .btn:active { transform: skewX(-7deg) translate(3px, 3px); box-shadow: 1px 1px 0 var(--sk-hard); }
html[data-skin="comic"] :is(.chip, .badge, .seg button) { border: 2px solid var(--sk-line); border-radius: 3px; }
html[data-skin="comic"] .chip { box-shadow: 3px 3px 0 var(--sk-hard); font-weight: 600; }
html[data-skin="comic"] :is(input, select, textarea) { border: 3px solid var(--sk-line); border-radius: 4px; }
html[data-skin="comic"] .opt { border-width: 3px; border-radius: 6px; box-shadow: 4px 4px 0 var(--sk-hard); font-weight: 600; }
html[data-skin="comic"] .opt:not(.right):not(.wrong):not(.picked) { border-color: var(--sk-line); }
html[data-skin="comic"] .tile { border: 3px solid var(--sk-line); border-radius: 4px; box-shadow: 3px 3px 0 var(--sk-hard); }
html[data-skin="comic"] :is(.progress, .xpbar) { border: 2px solid var(--sk-line); border-radius: 2px; transform: skewX(-15deg); }
html[data-skin="comic"] .hero { border: 4px solid var(--sk-line); border-radius: 8px; box-shadow: 9px 9px 0 var(--sk-hard);
  background: repeating-linear-gradient(-28deg, rgba(0,0,0,.09) 0 12px, transparent 12px 26px), linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 55%, var(--accent) 130%); }
html[data-skin="comic"] .hero h1 { display: table; background: #fff; color: #14111f; padding: .05em .3em; transform: rotate(-2deg) skewX(-9deg); box-shadow: 7px 7px 0 #14111f; }
html[data-skin="comic"] .hero p { display: inline; background: rgba(0,0,0,.55); line-height: 1.9; padding: .15em .4em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
html[data-skin="comic"] .hero .row { margin-top: 22px !important; }
html[data-skin="comic"] .hero .btn { border-color: #14111f; box-shadow: 5px 5px 0 #14111f; }
html[data-skin="comic"] .bottom-nav { border-top: 4px solid var(--sk-line); }
html[data-skin="comic"] .foot { border-top: 4px solid var(--sk-line); }

/* ---------- 👾 เกมพิกเซล ---------- */
html[data-skin="pixel"] { --sk-line: var(--ink); --radius: 0; }
html[data-skin="pixel"] body { font-family: "Chakra Petch", "Noto Sans Thai", system-ui, sans-serif;
  background-image: conic-gradient(color-mix(in srgb, var(--brand) 7%, transparent) 25%, transparent 0 50%, color-mix(in srgb, var(--brand) 7%, transparent) 0 75%, transparent 0);
  background-size: 32px 32px; }
html[data-skin="pixel"] :is(h1, h2, h3):not(.vs-title, .rs-title), html[data-skin="pixel"] :is(.btn, .logo, .chip, .badge, .stat .v, .q-prompt) { font-family: "Pixelify Sans", "Chakra Petch", "Noto Sans Thai", sans-serif; letter-spacing: .02em; }
html[data-skin="pixel"] :is(.card, .feature, .stat, .game-card, .tick-opt, .pal, .item, .lootbox, .qcard, .mcard, .install-card, .hero, .opt, .tile, .chip, input, select, textarea, .toast) {
  border: 0 !important; border-radius: 0 !important;
  box-shadow: 0 -4px 0 0 var(--sk-line), 0 4px 0 0 var(--sk-line), -4px 0 0 0 var(--sk-line), 4px 0 0 0 var(--sk-line), 8px 8px 0 0 rgba(0,0,0,.22); }
html[data-skin="pixel"] .opt.right { box-shadow: 0 -4px 0 0 var(--ok), 0 4px 0 0 var(--ok), -4px 0 0 0 var(--ok), 4px 0 0 0 var(--ok); }
html[data-skin="pixel"] .opt.wrong { box-shadow: 0 -4px 0 0 var(--bad), 0 4px 0 0 var(--bad), -4px 0 0 0 var(--bad), 4px 0 0 0 var(--bad); }
html[data-skin="pixel"] :is(.opt, .chip, .tile) { margin: 4px; }
html[data-skin="pixel"] .game-card:hover { transform: translateY(-4px); }
html[data-skin="pixel"] .btn { border-radius: 0; border: 0; box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.3), 0 0 0 3px var(--sk-line); margin: 3px; }
html[data-skin="pixel"] .btn:active { transform: translate(2px, 2px); box-shadow: inset 4px 4px 0 rgba(0,0,0,.35), 0 0 0 3px var(--sk-line); }
html[data-skin="pixel"] :is(.badge, .seg, .seg button, .switch span, .ava) { border-radius: 0 !important; }
html[data-skin="pixel"] :is(.progress, .xpbar) { border-radius: 0; box-shadow: 0 0 0 3px var(--sk-line); }
html[data-skin="pixel"] :is(.progress, .xpbar) > i { border-radius: 0; background: repeating-linear-gradient(90deg, var(--brand) 0 10px, var(--accent) 10px 12px); }
html[data-skin="pixel"] .hero { background: repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 2px, transparent 2px 4px),
  linear-gradient(180deg, var(--hero-a) 0 34%, var(--hero-b) 34% 67%, color-mix(in srgb, var(--hero-b) 60%, var(--accent)) 67%); }
html[data-skin="pixel"] .hero h1 { text-shadow: 4px 4px 0 rgba(0,0,0,.45); }
html[data-skin="pixel"] .hero-art { image-rendering: pixelated; animation: pxBob 1s steps(2) infinite; }
@keyframes pxBob { 50% { transform: translateY(-8px); } }
html[data-skin="pixel"] .nav { border-bottom: 4px solid var(--sk-line); }
html[data-skin="pixel"] .bottom-nav { border-top: 4px solid var(--sk-line); }

/* ---------- 🌃 นีออนไซเบอร์ (มืดเสมอ) ---------- */
html[data-skin="neon"]:root:not(._) { --bg: #07060f; --card: rgba(18, 14, 38, .78); --ink: #eef0ff; --mute: #a9a5cc; --soft: #1a1633; --brand-soft: #211a45;
  --line: color-mix(in srgb, var(--brand) 55%, #3a3560); --link: #9fe7ff; --ok: #4ade80; --ok-soft: #0f2e1d; --bad: #ff8a9b; --bad-soft: #3a1720; --warn: #ffd166; --warn-soft: #3a2e0c;
  --shadow: 0 0 22px color-mix(in srgb, var(--brand) 30%, transparent); --neon: color-mix(in srgb, var(--brand) 60%, #9fe7ff); color-scheme: dark; }
html[data-skin="neon"] body { font-family: "Chakra Petch", "Noto Sans Thai", system-ui, sans-serif;
  background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--brand) 40%, transparent), transparent 60%),
    linear-gradient(color-mix(in srgb, var(--brand) 13%, transparent) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, color-mix(in srgb, var(--brand) 13%, transparent) 1px, transparent 1px) 0 0 / 44px 44px, #07060f; background-attachment: fixed; }
html[data-skin="neon"] :is(h1, h2):not(.vs-title, .rs-title) { text-shadow: 0 0 8px var(--neon), 0 0 22px color-mix(in srgb, var(--accent) 70%, transparent); }
html[data-skin="neon"] .logo { text-shadow: 0 0 10px var(--neon); }
html[data-skin="neon"] .nav { background: rgba(7, 6, 15, .72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--neon); box-shadow: 0 0 18px color-mix(in srgb, var(--brand) 35%, transparent); }
html[data-skin="neon"] :is(.card, .feature, .stat, .game-card, .tick-opt, .pal, .item, .lootbox, .qcard, .mcard, .install-card) {
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid color-mix(in srgb, var(--neon) 60%, transparent); border-radius: 10px;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 20%, transparent), 0 0 16px color-mix(in srgb, var(--brand) 22%, transparent); }
html[data-skin="neon"] .game-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 28px color-mix(in srgb, var(--accent) 55%, transparent); }
html[data-skin="neon"] .btn { border-radius: 8px; box-shadow: 0 0 12px color-mix(in srgb, var(--brand) 80%, transparent), 0 0 30px color-mix(in srgb, var(--accent) 35%, transparent); text-shadow: 0 0 6px rgba(255,255,255,.6); }
html[data-skin="neon"] .btn-ghost { background: transparent; border: 1px solid var(--neon); color: var(--ink) !important; }
html[data-skin="neon"] :is(.chip, .badge) { border: 1px solid color-mix(in srgb, var(--neon) 70%, transparent); background: rgba(255,255,255,.04); }
html[data-skin="neon"] .opt { background: rgba(18, 14, 38, .7); border-radius: 10px; }
html[data-skin="neon"] .opt:hover:not(:disabled) { box-shadow: 0 0 16px color-mix(in srgb, var(--brand) 55%, transparent); }
html[data-skin="neon"] :is(input, select, textarea) { background: rgba(0,0,0,.35); border-color: color-mix(in srgb, var(--neon) 50%, transparent); }
html[data-skin="neon"] :is(.progress, .xpbar) > i { box-shadow: 0 0 12px var(--accent); }
html[data-skin="neon"] .hero { border: 1px solid var(--neon); border-radius: 18px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--hero-a) 55%, transparent), color-mix(in srgb, var(--accent) 25%, transparent)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px), #0c0a1c;
  box-shadow: 0 0 30px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 0 40px color-mix(in srgb, var(--brand) 25%, transparent); }
html[data-skin="neon"] .hero h1 { text-shadow: 0 0 10px #fff, 0 0 26px var(--neon), 0 0 46px var(--accent); }
html[data-skin="neon"] .hero-art { filter: drop-shadow(0 0 18px var(--accent)); }
html[data-skin="neon"] .bottom-nav { background: rgba(7, 6, 15, .85); border-top: 1px solid var(--neon); }

/* ---------- ✏️ สมุดวาดเขียน (สว่างเสมอ) ---------- */
html[data-skin="sketch"]:root:not(._) { --bg: #fbf7ec; --card: #fffdf6; --ink: #2b2a33; --mute: #5d5a6b; --soft: #f3eddc; --line: #2b2a33;
  --brand-soft: color-mix(in srgb, var(--brand) 14%, #fffdf6); --ok: #15803d; --ok-soft: #dcfce7; --bad: #c62f45; --bad-soft: #fde4e8; --warn: #9a6700; --warn-soft: #fff4d6;
  --link: color-mix(in srgb, var(--brand) 85%, #000); --shadow: 3px 4px 0 rgba(43, 42, 51, .18); color-scheme: light;
  --wob: 255px 15px 225px 15px / 15px 225px 15px 255px; }
html[data-skin="sketch"] body { font-family: "Itim", "Noto Sans Thai", system-ui, sans-serif; font-size: 1.06rem;
  background: linear-gradient(90deg, transparent 54px, rgba(220, 80, 80, .35) 54px 56px, transparent 56px),
    repeating-linear-gradient(transparent 0 31px, rgba(80, 120, 200, .18) 31px 32px), #fbf7ec; }
html[data-skin="sketch"] main h2:not(.vs-title, .rs-title) { text-decoration: underline wavy color-mix(in srgb, var(--accent) 80%, #000); text-decoration-thickness: 2px; text-underline-offset: 7px; }
html[data-skin="sketch"] .nav { background: #fffdf6; border-bottom: 2px dashed var(--ink); }
html[data-skin="sketch"] :is(.card, .feature, .stat, .game-card, .tick-opt, .pal, .item, .lootbox, .qcard, .mcard, .install-card) {
  border: 2px solid var(--ink); border-radius: var(--wob); box-shadow: 3px 4px 0 rgba(43, 42, 51, .2); }
html[data-skin="sketch"] :is(.card, .lootbox, .install-card) { border-radius: 22px 8px 26px 10px / 10px 26px 8px 22px; }
html[data-skin="sketch"] .game-card:nth-child(odd), html[data-skin="sketch"] .feature:nth-child(odd) { transform: rotate(-.7deg); }
html[data-skin="sketch"] .game-card:nth-child(even), html[data-skin="sketch"] .feature:nth-child(even) { transform: rotate(.6deg); }
html[data-skin="sketch"] .game-card:hover { transform: rotate(0) scale(1.02); box-shadow: 5px 7px 0 rgba(43, 42, 51, .25); }
html[data-skin="sketch"] .btn { border: 2px solid var(--ink); border-radius: var(--wob); box-shadow: 2px 3px 0 var(--ink); }
html[data-skin="sketch"] .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
html[data-skin="sketch"] :is(.chip, .badge, input, select, textarea, .tile) { border: 2px solid var(--ink); border-radius: var(--wob); }
html[data-skin="sketch"] .opt { border-width: 2px; border-radius: var(--wob); }
html[data-skin="sketch"] .opt:not(.right):not(.wrong):not(.picked) { border-color: var(--ink); }
html[data-skin="sketch"] :is(.progress, .xpbar) { border: 2px solid var(--ink); }
html[data-skin="sketch"] :is(.progress, .xpbar) > i { background: repeating-linear-gradient(-45deg, var(--brand) 0 6px, color-mix(in srgb, var(--brand) 60%, #fff) 6px 10px); }
html[data-skin="sketch"] .hero { color: var(--ink); background: #fff3a8; border-radius: 4px 4px 30px 4px / 4px 4px 60px 4px; transform: rotate(-.6deg); box-shadow: 6px 10px 18px rgba(0,0,0,.14); }
html[data-skin="sketch"] .hero::before { content: ""; position: absolute; top: -10px; left: 50%; width: 130px; height: 32px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
html[data-skin="sketch"] .hero h1 { text-decoration: underline wavy var(--brand); text-underline-offset: 10px; text-decoration-thickness: 3px; }
html[data-skin="sketch"] .hero .btn { background: var(--brand); color: #fff !important; }
html[data-skin="sketch"] .hero .btn-ghost { background: #fffdf6; color: var(--ink) !important; border-color: var(--ink); }
html[data-skin="sketch"] .bottom-nav { background: #fffdf6; border-top: 2px dashed var(--ink); }

/* ---------- 🫧 กระจกใส ---------- */
html[data-skin="glass"] { --radius: 22px; --glass-b: color-mix(in srgb, var(--ink) 16%, transparent); }
html[data-skin="glass"] body { font-family: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  background: radial-gradient(circle at 10% 15%, color-mix(in srgb, var(--brand) 65%, transparent), transparent 34%),
    radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--accent) 60%, transparent), transparent 32%),
    radial-gradient(circle at 75% 85%, color-mix(in srgb, var(--brand) 50%, transparent), transparent 36%),
    radial-gradient(circle at 18% 82%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 32%),
    linear-gradient(160deg, color-mix(in srgb, var(--bg) 80%, var(--brand)), var(--bg)); background-attachment: fixed; }
html[data-skin="glass"] .nav { background: color-mix(in srgb, var(--card) 45%, transparent); backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5); border-bottom: 1px solid var(--glass-b); }
html[data-skin="glass"] :is(.card, .feature, .stat, .game-card, .tick-opt, .pal, .item, .lootbox, .qcard, .mcard, .install-card, .chip, .opt) {
  background: color-mix(in srgb, var(--card) 52%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
